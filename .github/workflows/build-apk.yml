
name: Build Lab Report Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract updated ZIP
        run: |
          unzip -q Lab_Report_Studio_Android_APK_Builder_PRINT_FIX.zip -d project
          find project -name settings.gradle -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          APK=$(find . -path '*/build/outputs/apk/debug/app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Report-Studio-APK
          path: output/app-debug.apk
          retention-days: 14
